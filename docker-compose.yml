version: "3.9"

services:
  db:
    image: postgres:15
    container_name: odoo18_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${USER:-odoo}
      POSTGRES_PASSWORD: ${PASSWORD:?La variable PASSWORD no está definida en .env}
    volumes:
      # Persist PostgreSQL data between restarts.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18
    container_name: odoo18_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      # Odoo official image uses these variables to connect to PostgreSQL.
      HOST: ${HOST:-db}
      USER: ${USER:-odoo}
      PASSWORD: ${PASSWORD:?La variable PASSWORD no está definida en .env}
      # Master password: protects database manager
      ADMIN_PASSWD: ${ADMIN_PASSWD:?La variable ADMIN_PASSWD no está definida en .env}
    volumes:
      # Custom addons
      - ./custom-addons:/mnt/extra-addons
      # Persistent filestore: uploaded files survive redeployments
      - odoo_filestore:/var/lib/odoo
      # Odoo configuration (list_db, dbfilter, workers, etc.)
      - ./config:/mnt/gestori-config
    command:
      - odoo
      - --config=/mnt/gestori-config/odoo.conf
      - --admin-passwd=${ADMIN_PASSWD}

volumes:
  postgres_data:
  odoo_filestore:
