[options]
; =============================================================
; GESTORI — Configuración de Odoo
; Este archivo NO contiene secretos y es seguro para Git.
; Las contraseñas se inyectan vía variables de entorno en
; docker-compose (PASSWORD, ADMIN_PASSWD).
; =============================================================

; Addons: primero los estándar de Odoo, luego los personalizados
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Multi-tenant: conecta al cliente según su dominio
; Ejemplo: acme.gestori.com → base de datos "acme"
dbfilter = ^%d$

; Logging: solo errores y advertencias en producción
log_level = warn

; Rendimiento (ajustar en Fase 3 según el servidor)
; 0 = modo simple (un proceso), suficiente para empezar
workers = 0
limit_time_real = 120
limit_memory_hard = 2684354560
